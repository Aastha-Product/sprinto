[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brendo"
version = "0.2.0"
description = "Automated, defensible cold-outreach pipeline for Sprinto (MESA AI Case 2 / B2)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "anthropic>=2.10",   # structured outputs (output_config) + server-side refusal fallbacks
  "psycopg[binary]>=3.2",   # Postgres campaign record when DATABASE_URL is set
]

[project.optional-dependencies]
browser = ["playwright>=1.47"]
dev = ["pytest>=8"]

[project.scripts]
brendo = "brendo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
